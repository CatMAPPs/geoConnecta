<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoConnections</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>GeoConnections</h1>
        <p>Connecta les cartes basant-te en les seves propietats!</p>
    </header>

    <main>
        <div id="gameGrid"></div>

        <div class="controls">
            <button id="shuffleButton">Barrejar</button>
            <button id="deselectButton">Desseleccionar</button>
            <button id="submitButton">Enviar</button>
        </div>

        <div class="info">
            <p>Vides restants: <span id="lives">❤️ ❤️ ❤️</span></p>
            <p>Puntuació: <span id="score">0</span></p>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
